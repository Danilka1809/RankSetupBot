<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Status | Мониторинг Minecraft сервера</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #0f1724 100%);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(59,130,246,0.08), transparent);
            pointer-events: none;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(59,130,246,0.3); }
            50% { box-shadow: 0 0 25px rgba(59,130,246,0.5); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            z-index: 2;
            animation: fadeInUp 0.6s ease-out;
        }

        /* Стеклянная карточка */
        .glass-card {
            background: rgba(18, 25, 45, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 40px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4);
        }

        /* Логотип */
        .logo {
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #8b9dc3;
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* Статус-индикатор */
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .status-offline { background: #ef4444; box-shadow: 0 0 10px #ef4444; animation: none; }

        /* Статистика */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: rgba(0,0,0,0.3);
            border-radius: 32px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-5px); }

        .stat-value {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-label {
            font-size: 12px;
            color: #8b9dc3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        /* MOTD блок */
        .motd-card {
            background: rgba(0,0,0,0.3);
            border-radius: 32px;
            padding: 20px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            text-align: center;
            border-left: 3px solid #3b82f6;
        }

        /* Кнопка обновления */
        .refresh-btn {
            background: #3b82f6;
            border: none;
            border-radius: 60px;
            padding: 12px 28px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            width: 100%;
        }

        .refresh-btn:hover {
            background: #2563eb;
            transform: scale(1.02);
        }

        /* Футер */
        .footer {
            text-align: center;
            font-size: 12px;
            color: #6c7a91;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(59,130,246,0.1);
        }

        .online-count {
            font-size: 14px;
            font-weight: 500;
        }

        .server-ip {
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 60px;
            display: inline-block;
            margin-top: 16px;
        }

        /* Анимация загрузки */
        .loading {
            animation: pulse 1.5s infinite;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <div class="logo">⚡ GRIF STATUS</div>
            <div class="subtitle">Мониторинг состояния сервера в реальном времени</div>

            <div style="text-align: center; margin-bottom: 16px;">
                <span class="server-ip" id="serverIp"></span>
            </div>

            <div id="statusContent">
                <div style="text-align: center;">
                    <div class="online-count loading">Загрузка данных...</div>
                </div>
            </div>

            <button class="refresh-btn" onclick="fetchStatus()">🔄 Обновить сейчас</button>
            
            <div class="footer">
                Данные обновляются автоматически каждую минуту
            </div>
        </div>
    </div>

    <script>
        const SERVER_HOST = 'ТВОЙ_СЕРВЕР.aternos.me'; // ЗАМЕНИ
        const SERVER_PORT = 25565;

        document.getElementById('serverIp').innerText = `${SERVER_HOST}:${SERVER_PORT}`;

        async function fetchStatus() {
            const container = document.getElementById('statusContent');
            container.innerHTML = '<div style="text-align: center;"><div class="online-count loading">🔄 Обновление...</div></div>';
            
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                renderStatus(data);
            } catch (err) {
                container.innerHTML = `
                    <div style="text-align: center;">
                        <div class="online-count" style="color: #ef4444;">❌ Ошибка подключения к API</div>
                    </div>
                `;
            }
        }

        function renderStatus(data) {
            const container = document.getElementById('statusContent');
            
            if (data.online) {
                container.innerHTML = `
                    <div style="text-align: center;">
                        <div class="online-count">
                            <span class="status-indicator status-online"></span>
                            <span style="font-weight: 600;">СЕРВЕР ОНЛАЙН</span>
                        </div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${data.players || 0}</div>
                            <div class="stat-label">ИГРОКОВ ОНЛАЙН</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.maxPlayers || 20}</div>
                            <div class="stat-label">МАКСИМУМ</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.latency || 0}ms</div>
                            <div class="stat-label">ПИНГ</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" style="font-size: 24px;">${data.version || '1.20'}</div>
                            <div class="stat-label">ВЕРСИЯ</div>
                        </div>
                    </div>
                    
                    <div class="motd-card">
                        <div style="color: #3b82f6; margin-bottom: 8px;">💬 MOTD</div>
                        <div>${escapeHtml(data.motd || 'Добро пожаловать!')}</div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div style="text-align: center;">
                        <div class="online-count">
                            <span class="status-indicator status-offline"></span>
                            <span style="font-weight: 600; color: #ef4444;">СЕРВЕР ОФФЛАЙН</span>
                        </div>
                        <div style="margin-top: 20px; color: #8b9dc3;">
                            Сервер не отвечает. Попробуйте позже.
                        </div>
                        ${data.error ? `<div style="margin-top: 12px; font-size: 12px; color: #6c7a91;">Ошибка: ${data.error}</div>` : ''}
                    </div>
                `;
            }
            
            container.innerHTML += `<div style="text-align: center; margin-top: 16px; font-size: 11px; color: #6c7a91;">
                📅 Последнее обновление: ${new Date(data.lastUpdate).toLocaleString()}
            </div>`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Загрузка и автообновление каждые 60 секунд
        fetchStatus();
        setInterval(fetchStatus, 60000);
    </script>
</body>
</html>
